name: verify
on:
  push:
    branches: [main]
  pull_request:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build engine embed
        run: node tools/build-engine.cjs
      - name: Verify controls + regulatory embed
        run: node tools/verify-controls.cjs
      - name: Verify OSV samples
        run: node tools/verify-osv.cjs
      - name: Verify NDS samples
        run: node tools/verify-nds.cjs
      - name: Ensure working tree clean after build
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree dirty after build-engine — commit regenerated embed"
            git status --porcelain
            exit 1
          fi
